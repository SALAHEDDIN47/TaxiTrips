    id: description
    attributes:
      label: "Description du bug"
      description: "Quel est le comportement observé ?"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Comment le reproduire ?"
      description: "Étapes pour reproduire le bug"