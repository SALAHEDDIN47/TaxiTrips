[project]
name = "taxitrips"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SALAHEDDIN47", email = "salaheddinejalloul538@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pytest>=9.2.0",
]

[project.scripts]
taxitrips = "taxitrips:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
